name: Scheduled Render Deploy

# このワークフローがトリガーされるタイミングを指定
on:
  # GitHubのUIから手動で実行できるようにする
  workflow_dispatch:

jobs:
  # デプロイを行うジョブ
  deploy:
    runs-on: ubuntu-latest

    # 環境変数にAPIキーをセット
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          # Render.comのデプロイ用APIを呼び出す
          # ここではcurlコマンドを使用
          # URLはRenderのデプロイフックURLに置き換えてください
          curl -X POST "https://api.render.com/v1/services/srv-XXXXXXXXXXXXXX/deploys?key=$RENDER_API_KEY"
          #curl -X POST "https://api.render.com/deploy/srv-$RENDER_PROJECT_ID?key=$DEPLOY_KEY" 

