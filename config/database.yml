default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  port: 5432

development:
  <<: *default
  <% if Rails.env.development? %>
  host: <%= Rails.application.credentials.development[:PROPUGNARE_SUPABASE_HOST] %>
  password: <%= Rails.application.credentials.development[:PROPUGNARE_SUPABASE_PASSWORD] %>
  username: <%= Rails.application.credentials.development[:PROPUGNARE_SUPABASE_USERNAME] %>
  database: <%= Rails.application.credentials.development[:PROPUGNARE_SUPABASE_DATABASE] %>
  port: <%= Rails.application.credentials.development[:PROPUGNARE_SUPABASE_PORT] %>
  prepared_statements: false
  <% end %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  <% if Rails.env.test? %> #環境変数があれば
  host: <%#= Rails.application.credentials.development[:PROPUGNARE_SUPABASE_HOST] %>
  password: <%#= Rails.application.credentials.development[:PROPUGNARE_SUPABASE_PASSWORD] %>
  username: <%#= Rails.application.credentials.development[:PROPUGNARE_SUPABASE_USERNAME] %>
  database: <%#= Rails.application.credentials.development[:PROPUGNARE_SUPABASE_DATABASE] %>
  port: <%#= Rails.application.credentials.development[:PROPUGNARE_SUPABASE_PORT] %>
  <% end %>



production:
  <<: *default
  host: <%#= ENV['PROPUGNARE_SUPABASE_HOST']
  password: <%#= ENV['PROPUGNARE_SUPABASE_PASSWORD']
  username: <%#= ENV['PROPUGNARE_SUPABASE_USERNAME']
  database: <%#= ENV['PROPUGNARE_SUPABASE_DATABASE']

# Fly.ioの環境変数を優先し、存在しない場合はクレデンシャルを参照する
#host: <%#= ENV['PROPUGNARE_SUPABASE_HOST'] || Rails.application.credentials.development[:PROPUGNARE_SUPABASE_HOST] %>
